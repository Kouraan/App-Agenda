<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App-Agenda - Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="title">LOGIN</h1>
            <div id="errorLabel" class="error-message">Utilizador ou password incorretos</div>
            
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="usernameField">Username :</label>
                    <input type="text" id="usernameField" required>
                </div>
                
                <div class="form-group">
                    <label for="passwordField">Password :</label>
                    <input type="password" id="passwordField" required>
                </div>
                
                <div class="button-container">
                    <button type="submit" id="entrarBtn">Entrar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
