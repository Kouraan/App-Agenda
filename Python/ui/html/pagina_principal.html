<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App-Agenda - Página Principal</title>
    <link rel="stylesheet" href="../css/pagina_principal.css">
</head>
<body>
    <!-- Área Superior com informações do usuário e navegação -->
    <header class="top-bar">
        <div class="logo">App Agenda</div>
        <div class="spacer"></div>
        <div id="userLabel" class="user-info">Bem-vindo, Utilizador</div>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </header>
 
    <!-- Área Principal dividida em 3 colunas -->
    <main class="main-content">
        <!-- Área Lateral Esquerda -->
        <aside class="left-sidebar">
            <div class="navigation-buttons">
                <button id="calendarioToggle" class="nav-btn active">Calendário</button>
                <button id="clientesToggle" class="nav-btn">Clientes</button>
            </div>
 
            <div class="anotacoes-box">
                <div class="anotacoes-header">
                    <span class="title">Anotações</span>
                    <button id="blurToggleBtn" class="blur-btn">👁</button>
                </div>
                <div class="separator"></div>
                <textarea id="anotacoesArea" placeholder="Escreva suas anotações aqui..." class="anotacoes-text blurred"></textarea>
            </div>
        </aside>
 
        <!-- Área Central - Calendário -->
        <section class="center-area">
            <div id="areaCentral" class="calendar-container">
                <!-- Cabeçalho do calendário -->
                <div class="calendar-header">
                    <div class="navigation-controls">
                        <button id="todayBtn"          class="control-btn">Hoje</button>
                        <button id="semanaAnteriorBtn" class="control-btn">◀</button>
                        <button id="proximaSemanaBtn"  class="control-btn">▶</button>
                    </div>
 
                    <div class="spacer"></div>
 
                    <div id="semanaLabel" class="period-label"></div>
 
                    <div class="spacer"></div>
 
                    <div class="view-toggles">
                        <button id="diaToggle"    class="view-btn">Dia</button>
                        <button id="semanaToggle" class="view-btn active">Semana</button>
                        <button id="mesToggle"    class="view-btn">Mês</button>
                    </div>
                </div>
 
                <!-- Grade do calendário -->
                <div class="calendar-scroll">
                    <div id="calendarioGrid" class="calendar-grid"></div>
                </div>
            </div>
 
            <!-- Área de Clientes (inicialmente oculta) -->
            <div id="areaClientes" class="clientes-container hidden">
                <div id="clientesContent" class="clientes-content"></div>
            </div>
        </section>
 
        <!-- Área Lateral Direita -->
        <aside class="right-sidebar">
            <h3 class="section-title">Clientes Pendentes</h3>
            <div class="separator"></div>
            <div class="pendentes-scroll">
                <div id="caixaClientesPendentes" class="pendentes-container"></div>
            </div>
            <div class="separator"></div>
            <div id="relogioLabel" class="clock">00:00:00</div>
        </aside>
    </main>
 
    <script type="module" src="../js/pagina_principal.js"></script>
</body>
</html>
