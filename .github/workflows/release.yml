name: Build e Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extrair número de versão da tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Escrever version.txt
        shell: bash
        run: echo "${{ steps.version.outputs.version }}" > version.txt

      - name: Criar .env a partir dos secrets
        shell: bash
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_EMAIL=${{ secrets.SUPABASE_SERVICE_EMAIL }}
          SUPABASE_SERVICE_PASSWORD=${{ secrets.SUPABASE_SERVICE_PASSWORD }}
          EOF

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Correr o build
        run: python build.py

      - name: Compactar o resultado
        shell: powershell
        run: |
          Compress-Archive -Path "dist/AppAgenda" -DestinationPath "AppAgenda-v${{ steps.version.outputs.version }}.zip"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AppAgenda-v${{ steps.version.outputs.version }}.zip
          name: "v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
